[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-shield"
version = "1.0.0"
description = "Quantum-Shield unified distributed-storage research prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=47.0.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
qs = "quantum_shield.cli:main"
qs-worker = "quantum_shield.storage.worker:main"
qs-client = "quantum_shield.storage.client:main"
qs-distribute = "quantum_shield.distribution_cli:main"
qs-files = "quantum_shield.file_cli:main"
qs-benchmark = "quantum_shield.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
